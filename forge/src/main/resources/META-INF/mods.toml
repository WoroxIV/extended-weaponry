modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_display_url}"
logoFile="logo.png"
logoBlur=false
description='''${mod_description}'''

# Better Weaponry crée les armes de ces matériaux (voir com.betterweaponry.api.WeaponMaterialProvider).
[modproperties.${mod_id}]
better_weaponry_materials="com.extendedweaponry.item.ExtendedMaterials"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="better_weaponry"
mandatory=true
versionRange="[${better_weaponry_version},)"
ordering="AFTER"
side="BOTH"
