plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'me.modmuss50.mod-publish-plugin'
}

ext.gameTestAnnotations = '@net.minecraftforge.gametest.GameTestHolder(ExtendedWeaponry.MODID)\n@net.minecraftforge.gametest.PrefixGameTestTemplate(false)'
ext.gameTestArena = 'empty'

def betterWeaponryJar = rootProject.ext.betterWeaponryJar('forge')

legacyForge {
    version = forge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            gameDirectory = rootProject.file("run/${name}")
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Après le bloc legacyForge : c'est lui qui crée la tâche reobfJar.
apply from: rootProject.file('gradle/publish.gradle')

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config 'extendedweaponry.mixins.json'
}

tasks.named('processResources', ProcessResources) {
    // Forge cherche la table de correspondance des noms indiquée dans chaque configuration de mixins.
    filesMatching(['extendedweaponry.mixins.json']) {
        filter { String line -> line.contains('"package"') ? "  \"refmap\": \"${mod_id}.refmap.json\",\n" + line : line }
    }
    // Pas de modificateurs de butin sur Forge 1.20.1 : le butin est ajouté par LootTableLoadEvent.
    exclude 'data/extended_weaponry/loot_modifiers/**', 'data/neoforge/**'
}

// Le bloc mixin ci-dessus ne sert qu'au développement : dans le jar publié, Forge lit la liste dans le manifeste.
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'extendedweaponry.mixins.json')
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    jarJar "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"

    compileOnly files(betterWeaponryJar)
}

// Better Weaponry est un vrai mod : son jar aux noms de développement est copié dans le dossier "mods" de chaque lancement.
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach { task ->
    def runName = task.name.substring(3, 4).toLowerCase() + task.name.substring(4)
    doFirst {
        def mods = rootProject.file("run/${runName}/mods")
        project.delete(fileTree(mods) { include 'better_weaponry-*.jar' })
        project.copy { from betterWeaponryJar; into mods }
    }
}
